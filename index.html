<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اولویت‌بندی رشته‌ها</title>
<script>try{var t=localStorage.getItem('majors_theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa;--card:#fff;--text:#1d2433;--muted:#6b7488;--line:#e5e8f0;
  --accent:#4f46e5;--accent-soft:#eef0ff;--warn:#fff7d1;--warn-line:#f3dc6b;--danger:#d93a4a;
  --g1:#e0f2e9;--g1t:#1c6b43;--g2:#e1ecfb;--g2t:#1f5aa6;--g3:#fdebd9;--g3t:#a15a12;--g4:#f1e4fa;--g4t:#7b3aa5;--gx:#eceef3;--gxt:#555e72;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12151c;--card:#1b1f29;--text:#e8ebf3;--muted:#9099ae;--line:#2b3140;
  --accent:#8b86ff;--accent-soft:#262a45;--warn:#3a3416;--warn-line:#6b5d1c;--danger:#ff6b78;
  --g1:#17382a;--g1t:#7fdcaa;--g2:#172a44;--g2t:#8dbcf5;--g3:#42301a;--g3t:#f0b778;--g4:#31213e;--g4t:#d3a4f2;--gx:#272c39;--gxt:#aab2c5;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b1f29;--text:#e8ebf3;--muted:#9099ae;--line:#2b3140;
  --accent:#8b86ff;--accent-soft:#262a45;--warn:#3a3416;--warn-line:#6b5d1c;--danger:#ff6b78;
  --g1:#17382a;--g1t:#7fdcaa;--g2:#172a44;--g2t:#8dbcf5;--g3:#42301a;--g3t:#f0b778;--g4:#31213e;--g4t:#d3a4f2;--gx:#272c39;--gxt:#aab2c5;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Vazirmatn',system-ui,sans-serif;line-height:1.7}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:1.5rem;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;direction:ltr;user-select:none;position:relative}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.switch .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track .knob{transform:translateX(20px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.switch .ico{font-size:1rem;width:1.3em;text-align:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:10px;transition:.15s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{opacity:.9;color:#fff}
button.ghost-danger:hover{border-color:var(--danger);color:var(--danger)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.add{padding:14px;display:grid;grid-template-columns:repeat(6,1fr) auto;gap:8px;margin-bottom:16px;align-items:end}
.add label{display:flex;flex-direction:column;font-size:.75rem;color:var(--muted);gap:3px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{background:var(--accent-soft);font-weight:500;font-size:.82rem;text-align:right;padding:10px 12px;color:var(--muted);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);font-size:.92rem;vertical-align:middle}
tr.warn td{background:var(--warn)}
tr.warn td:first-child{box-shadow:inset -3px 0 var(--warn-line)}
tr.sortable-ghost td{opacity:.35;background:var(--accent-soft)}
tr.sortable-chosen td{background:var(--accent-soft)}
.handle{cursor:grab;color:var(--muted);user-select:none;font-size:1.1rem;text-align:center;width:36px;touch-action:none}
.handle:active{cursor:grabbing}
.rank{width:52px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.78rem;white-space:nowrap}
.g1{background:var(--g1);color:var(--g1t)}.g2{background:var(--g2);color:var(--g2t)}
.g3{background:var(--g3);color:var(--g3t)}.g4{background:var(--g4);color:var(--g4t)}.gx{background:var(--gx);color:var(--gxt)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.5px;direction:ltr;display:inline-block;cursor:pointer;
  padding:2px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);border:1px dashed transparent;user-select:none}
.code:hover{border-color:var(--accent)}
.code.copied{background:#16a34a;color:#fff}
.del{border:none;background:none;color:var(--muted);padding:4px 8px;font-size:1.05rem}
.del:hover{color:var(--danger)}
.note{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem;display:flex;gap:8px;align-items:center}
.note i{display:inline-block;width:14px;height:14px;background:var(--warn);border:1px solid var(--warn-line);border-radius:4px}
.empty{padding:32px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);max-width:520px;width:calc(100% - 32px);padding:18px 20px;font:inherit}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 6px;font-size:1.05rem}
dialog ul{margin:8px 0 14px;padding-inline-start:20px;max-height:50vh;overflow:auto;font-size:.88rem}
dialog form{margin:0;text-align:left}
input:invalid[name=code]:not(:placeholder-shown){outline:2px solid var(--danger);outline-offset:-1px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:#1d2433;color:#fff;padding:8px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;font-size:.9rem}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.add{grid-template-columns:1fr 1fr}.add button{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>اولویت‌بندی رشته‌ها</h1>
      <p class="sub">برای کپی، روی کد رشته کلیک کنید · برای جابجایی، ردیف را با ⠿ بکشید · تغییرات خودکار ذخیره می‌شود</p>
    </div>
    <div class="actions">
      <label class="switch" title="تغییر تم (روشن / تیره)">
        <input type="checkbox" id="themeSwitch" role="switch" aria-label="تم تیره">
        <span class="track"><span class="knob"></span></span>
        <span class="ico" id="themeIcon">☀️</span>
      </label>
      <button class="primary" id="export">⬇ خروجی اکسل</button>
      <button id="import">⬆ ورود از اکسل</button>
      <input type="file" id="importFile" accept=".xlsx,.xls" hidden>
      <button class="ghost-danger" id="reset">بازنشانی به فایل اصلی</button>
    </div>
  </header>

  <form class="card add" id="addForm" autocomplete="off">
    <label>نام رشته<input name="name" required></label>
    <label>کد رشته<input name="code" required inputmode="numeric"></label>
    <label>شهر<input name="city" required></label>
    <label>دوره<input name="type" list="types" required></label>
    <label>خوابگاه<input name="dorm"></label>
    <label>گروه اولویت<select name="group"></select></label>
    <button class="primary" type="submit">+ افزودن</button>
    <datalist id="types"></datalist>
  </form>

  <div class="card">
    <div class="tablewrap">
      <table>
        <thead><tr><th></th><th>رتبه</th><th>گروه اولویت</th><th>نام رشته</th><th>کد رشته</th><th>شهر</th><th>دوره</th><th>وضعیت خوابگاه</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="note"><i></i> ردیف‌های زردرنگ: خوانایی دست‌خط کم بوده؛ لطفاً با عکس اصلی مطابقت دهید.</div>
  </div>
</div>
<dialog id="report">
  <h3></h3>
  <ul></ul>
  <form method="dialog"><button class="primary">بستن</button></form>
</dialog>
<div id="toast"></div>

<script src="data.js"></script>
<script src="vendor/Sortable.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script>
const KEY='majors_state_v1';
const GROUPS=['۱ - شیراز (روزانه + شهریه‌پرداز)','۲ - روزانه (به ترتیب نزدیکی به شیراز)','۳ - شهریه‌پرداز','۴ - غیرانتفاعی'];
const gcls=g=>{const n=(g||'').trim()[0];return {'۱':'g1','۲':'g2','۳':'g3','۴':'g4'}[n]||'gx'};
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const uid=()=>Math.random().toString(36).slice(2,10);
// ارقام فارسی/عربی → لاتین (برای مقایسهٔ یکتایی کد و تطبیق گروه)
const toLatin=s=>String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const normCode=c=>toLatin(c).replace(/[\s\u200c\u200f\u200e]+/g,'');
const findByCode=code=>{const k=normCode(code);return k?rows.find(r=>normCode(r.code)===k):undefined};

let rows=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s))return s}catch(e){}
  return fresh();
}
function fresh(){return window.DEFAULT_DATA.map(r=>({...r,id:uid()}))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}}

const tbody=document.getElementById('tbody');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){
  if(!rows.length){tbody.innerHTML='<tr><td colspan="9" class="empty">جدول خالی است.</td></tr>';checkCode();return}
  tbody.innerHTML=rows.map((r,i)=>`
    <tr data-id="${r.id}" class="${r.warn?'warn':''}">
      <td class="handle" title="بکشید">⠿</td>
      <td class="rank">${fa(i+1)}</td>
      <td><span class="badge ${gcls(r.group)}">${esc(r.group)}</span></td>
      <td>${esc(r.name)}</td>
      <td><span class="code" data-code="${esc(r.code)}" title="کلیک برای کپی">${esc(r.code)}</span></td>
      <td>${esc(r.city)}</td>
      <td>${esc(r.type)}</td>
      <td>${esc(r.dorm)}</td>
      <td><button class="del" data-del="${r.id}" title="حذف">✕</button></td>
    </tr>`).join('');
  checkCode();
}

let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1500)}
async function copy(text){
  try{await navigator.clipboard.writeText(text)}
  catch(e){const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
}

tbody.addEventListener('click',async e=>{
  const c=e.target.closest('.code');
  if(c){await copy(c.dataset.code);c.classList.add('copied');setTimeout(()=>c.classList.remove('copied'),700);toast('کد '+c.dataset.code+' کپی شد');return}
  const d=e.target.closest('[data-del]');
  if(d){const r=rows.find(x=>x.id===d.dataset.del);if(r&&confirm('رشته «'+r.name+'» حذف شود؟')){rows=rows.filter(x=>x.id!==r.id);save();render()}}
});

Sortable.create(tbody,{
  handle:'.handle',animation:150,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',
  onEnd(){
    const order=[...tbody.querySelectorAll('tr[data-id]')].map(t=>t.dataset.id);
    const map=new Map(rows.map(r=>[r.id,r]));
    rows=order.map(id=>map.get(id));
    save();render();
  }
});

// add form
const form=document.getElementById('addForm');
form.group.innerHTML=GROUPS.map(g=>`<option>${g}</option>`).join('');
function refreshTypes(){document.getElementById('types').innerHTML=[...new Set(rows.map(r=>r.type))].map(t=>`<option value="${esc(t)}">`).join('')}
refreshTypes();
// کد رشته باید یکتا باشد
function checkCode(){
  const dup=findByCode(form.code.value);
  form.code.setCustomValidity(dup?`کد ${fa(normCode(form.code.value))} قبلاً برای «${dup.name}» ثبت شده است`:'');
  return !dup;
}
form.code.addEventListener('input',checkCode);
form.addEventListener('submit',e=>{
  e.preventDefault();
  if(!checkCode()){form.code.reportValidity();return}
  const f=Object.fromEntries(new FormData(form));
  rows.push({id:uid(),group:f.group,name:f.name.trim(),code:normCode(f.code),city:f.city.trim(),type:f.type.trim(),dorm:(f.dorm||'').trim()});
  save();render();refreshTypes();
  form.name.value=form.code.value='';form.name.focus();
  toast('رشته اضافه شد (انتهای جدول)');
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
});

document.getElementById('reset').onclick=()=>{
  if(confirm('همه تغییرات پاک و جدول به حالت اولیه برمی‌گردد. مطمئنید؟')){rows=fresh();save();render();refreshTypes()}
};

// export
document.getElementById('export').onclick=()=>{
  const head=['رتبه','گروه اولویت','نام رشته','کد رشته','شهر','دوره','وضعیت خوابگاه'];
  const aoa=[head,...rows.map((r,i)=>[i+1,r.group,r.name,r.code,r.city,r.type,r.dorm||''])];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  // code as text
  rows.forEach((r,i)=>{const c=ws['D'+(i+2)];if(c){c.t='s';c.v=String(r.code)}});
  ws['!cols']=[{wch:7},{wch:36},{wch:24},{wch:12},{wch:14},{wch:22},{wch:22}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'اولویت‌بندی');
  wb.Workbook={Views:[{RTL:true}]};
  XLSX.writeFile(wb,'majors_prioritized.xlsx');
  toast('فایل اکسل ساخته شد');
};

// import
const HEAD_KEYS={group:'گروه اولویت',name:'نام رشته',code:'کد رشته',city:'شهر',type:'دوره',dorm:'وضعیت خوابگاه'};
const normHead=s=>String(s??'').replace(/[\u200c\u200f\u200e]/g,' ').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').trim();
const resolveGroup=g=>{
  g=String(g??'').trim();
  if(GROUPS.includes(g))return g;
  const k=toLatin(g)[0];
  return k?GROUPS.find(x=>toLatin(x)[0]===k):undefined;
};
function showReport(title,items){
  const d=document.getElementById('report');
  d.querySelector('h3').textContent=title;
  d.querySelector('ul').innerHTML=items.slice(0,30).map(i=>`<li>${esc(i)}</li>`).join('')
    +(items.length>30?`<li>و ${fa(items.length-30)} مورد دیگر…</li>`:'');
  d.showModal();
}
function parseImport(ws){
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const want=Object.fromEntries(Object.entries(HEAD_KEYS).map(([k,v])=>[k,normHead(v)]));
  // ردیف سرستون را پیدا کن (معمولاً ردیف اول)
  let hi=aoa.findIndex(r=>r.some(c=>normHead(c)===want.code));
  if(hi<0)return{errors:['ستون «'+HEAD_KEYS.code+'» در فایل پیدا نشد. فایل باید همان خروجی اکسل همین صفحه باشد.']};
  const col={};
  aoa[hi].forEach((c,i)=>{const h=normHead(c);for(const k in want)if(h===want[k]&&!(k in col))col[k]=i});
  const missing=['group','name','code','city','type'].filter(k=>!(k in col));
  if(missing.length)return{errors:['ستون‌های لازم پیدا نشد: '+missing.map(k=>'«'+HEAD_KEYS[k]+'»').join('، ')]};

  const errors=[],out=[],seen=new Map();
  for(let i=hi+1;i<aoa.length;i++){
    const r=aoa[i];
    if(r.every(c=>String(c).trim()===''))continue;
    const get=k=>k in col?String(r[col[k]]??'').trim():'';
    const n=i+1; // شمارهٔ ردیف در اکسل
    const rec={name:get('name'),code:normCode(get('code')),city:get('city'),type:get('type'),dorm:get('dorm')};
    const empty=['name','code','city','type'].filter(k=>!rec[k]).map(k=>HEAD_KEYS[k]);
    if(empty.length){errors.push(`ردیف ${fa(n)}: فیلد خالی (${empty.join('، ')})`);continue}
    rec.group=resolveGroup(get('group'));
    if(!rec.group){errors.push(`ردیف ${fa(n)}: گروه اولویت نامعتبر است («${get('group')}»)`);continue}
    if(seen.has(rec.code)){errors.push(`ردیف ${fa(n)}: کد ${fa(rec.code)} تکراری است (ردیف ${fa(seen.get(rec.code))} هم همین کد را دارد)`);continue}
    seen.set(rec.code,n);
    out.push(rec);
  }
  if(!errors.length&&!out.length)errors.push('هیچ ردیف دادهٔ معتبری در فایل پیدا نشد.');
  return{errors,out};
}
const importBtn=document.getElementById('import'),importFile=document.getElementById('importFile');
importBtn.onclick=()=>importFile.click();
importFile.onchange=async()=>{
  const file=importFile.files[0];
  importFile.value=''; // امکان انتخاب مجدد همان فایل
  if(!file)return;
  let res;
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    res=parseImport(wb.Sheets[wb.SheetNames[0]]);
  }catch(e){res={errors:['خواندن فایل ممکن نشد. مطمئن شوید فایل اکسل (xlsx) معتبر است.']}}
  if(res.errors.length){showReport('ورود فایل انجام نشد — هیچ تغییری اعمال نشد',res.errors);return}
  if(!confirm(`${fa(res.out.length)} رشته از فایل خوانده شد.\nجدول فعلی (${fa(rows.length)} ردیف) با محتوای فایل جایگزین شود؟`))return;
  // علامت «خوانایی کم» در خروجی اکسل نیست؛ برای کدهای موجود حفظ می‌شود
  const warnByCode=new Map(rows.filter(r=>r.warn).map(r=>[normCode(r.code),true]));
  rows=res.out.map(r=>({...r,id:uid(),...(warnByCode.has(r.code)?{warn:true}:{})}));
  save();render();refreshTypes();
  toast(fa(rows.length)+' رشته وارد شد');
};

// theme switch
const THEME_KEY='majors_theme';
const darkMQ=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):{matches:false};
const themeSw=document.getElementById('themeSwitch'),themeIcon=document.getElementById('themeIcon');
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':darkMQ.matches};
function syncTheme(){const d=isDark();themeSw.checked=d;themeIcon.textContent=d?'🌙':'☀️'}
themeSw.onchange=()=>{
  const t=themeSw.checked?'dark':'light';
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem(THEME_KEY,t)}catch(e){}
  syncTheme();
};
if(darkMQ.addEventListener)darkMQ.addEventListener('change',syncTheme);
syncTheme();

render();
</script>
</body>
</html>
